name: Update seminar calendars

on:
  schedule:
    # 13:00 UTC = 6am Pacific (5am during PDT). Runs every day.
    - cron: "0 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrape.py"
      - ".github/workflows/update-calendars.yml"

permissions:
  contents: write

concurrency:
  group: update-calendars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser tests
        run: python tests/test_parse.py

      - name: Scrape and rebuild feeds
        env:
          BASE_URL: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scrape.py --out docs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs events.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update seminar calendars ($(date -u +%Y-%m-%d))"
            git push
          fi
